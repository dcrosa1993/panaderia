name: Panaderia Backend

on:
  push:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Build and push image with Build Cloud
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: denismaycr/personal_projects:panaderia_backend_latest
          no-cache: true
          build-args: |
            NODE_ENV=development
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            PORT=3000
            FRONTEND_ORIGIN=https://panaderia.may.cu
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            BOOTSTRAP_ADMIN_EMAIL=${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
            BOOTSTRAP_ADMIN_PASSWORD=${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
            BOOTSTRAP_ADMIN_NAME=${{ secrets.BOOTSTRAP_ADMIN_NAME }}
            BOOTSTRAP_BAKERY_NAME=${{ secrets.BOOTSTRAP_BAKERY_NAME }}


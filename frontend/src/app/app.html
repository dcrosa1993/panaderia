<header class="topbar">
  <a class="brand" routerLink="/materials"><span class="brand-mark">P</span> Panadería</a>
  <nav aria-label="Navegación principal">
    <a routerLink="/materials" routerLinkActive="active">Materias primas</a>
  </nav>
  <div class="account">
    @if (session.bakeries().length > 0) {
      <label class="visually-hidden" for="active-bakery">Panadería activa</label>
      <select id="active-bakery" [value]="session.activeBakeryId() ?? ''" (change)="selectBakery($event)">
        @for (bakery of session.bakeries(); track bakery.id) {
          <option [value]="bakery.id">{{ bakery.name }}</option>
        }
      </select>
    } @else {
      <a routerLink="/select-bakery">Seleccionar panadería</a>
    }
    <span class="user-name">{{ session.user()?.displayName }}</span>
    <button class="text-button" type="button" (click)="logout()">Salir</button>
  </div>
</header>
<router-outlet />

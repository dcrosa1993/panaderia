name: Panaderia Backend Images

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          push: true
          tags: denismaycr/personal_projects:panaderia_backend_latest
          cache-from: type=gha,scope=panaderia-backend-runtime
          cache-to: type=gha,mode=max,scope=panaderia-backend-runtime
          build-args: |
            NODE_ENV=development
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            PORT=3000
            FRONTEND_ORIGIN=https://panaderia.may.cu
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            BOOTSTRAP_ADMIN_EMAIL=${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
            BOOTSTRAP_ADMIN_PASSWORD=${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
            BOOTSTRAP_ADMIN_NAME=${{ secrets.BOOTSTRAP_ADMIN_NAME }}
            BOOTSTRAP_BAKERY_NAME=${{ secrets.BOOTSTRAP_BAKERY_NAME }}

      - name: Build and push production migrator image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: migrator
          push: true
          tags: denismaycr/personal_projects:panaderia_migrator_latest
          cache-from: type=gha,scope=panaderia-backend-migrator
          cache-to: type=gha,mode=max,scope=panaderia-backend-migrator
          build-args: |
            NODE_ENV=development
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            PORT=3000
            FRONTEND_ORIGIN=https://panaderia.may.cu
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            BOOTSTRAP_ADMIN_EMAIL=${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
            BOOTSTRAP_ADMIN_PASSWORD=${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
            BOOTSTRAP_ADMIN_NAME=${{ secrets.BOOTSTRAP_ADMIN_NAME }}
            BOOTSTRAP_BAKERY_NAME=${{ secrets.BOOTSTRAP_BAKERY_NAME }}

services:
  postgres:
    image: postgres:18
    container_name: panaderia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - panaderia_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  pgadmin:
      image: dpage/pgadmin4:latest
      container_name: pgadmin
      restart: unless-stopped

      environment:
        PGADMIN_DEFAULT_EMAIL: denismaycr@gmail.com
        PGADMIN_DEFAULT_PASSWORD: Denismay2!
        PGADMIN_CONFIG_SERVER_MODE: "True"

      ports:
        - "5050:80"

      volumes:
        - pgadmin_data:/var/lib/pgadmin

volumes:
  panaderia_postgres_data:
  pgadmin_data:

name: Panaderia Backend Images

on:
  push:
    branches:
      - dev

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend runtime image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          push: true
          tags: denismaycr/personal_projects:panaderia_backend_latest
          cache-from: type=gha,scope=panaderia-backend-runtime
          cache-to: type=gha,mode=max,scope=panaderia-backend-runtime

      - name: Build and push production migrator image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: migrator
          push: true
          tags: denismaycr/personal_projects:panaderia_migrator_latest
          cache-from: type=gha,scope=panaderia-backend-migrator
          cache-to: type=gha,mode=max,scope=panaderia-backend-migrator
